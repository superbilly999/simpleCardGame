<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack Table</title>
  <style>
    :root {
      --bg: #0a1224;
      --bg-alt: #0f1d37;
      --panel: #111f3c;
      --card: #12284a;
      --accent: #f6c344;
      --accent-strong: #ff9f1c;
      --muted: #9fb3c8;
      --text: #e7ecf5;
      --glow: rgba(246, 195, 68, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #172a53 0, #0d172d 40%, #070d1c 100%);
      color: var(--text);
      font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: min(1100px, 100%);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }

    .table {
      background: linear-gradient(145deg, var(--panel), #0b1935);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .table-head {
      padding: 14px 18px;
      background: linear-gradient(120deg, rgba(246, 195, 68, 0.08), rgba(45, 212, 191, 0.1));
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-pill {
      padding: 8px 12px;
      background: rgba(45, 212, 191, 0.16);
      color: #9be7d7;
      border-radius: 12px;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .table-body {
      padding: 22px 20px 20px;
    }

    .hand {
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      margin-bottom: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .hand-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hand-title {
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 16px;
    }

    .value {
      color: var(--muted);
      font-size: 14px;
    }

    .cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card {
      width: 76px;
      height: 108px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--card), #0c1a34);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #dbe4ff;
      position: relative;
      animation: pop-in 240ms ease;
    }

    .card.red {
      color: #ff6b6b;
    }

    .card.hidden {
      background: repeating-linear-gradient(45deg, #0e1a31, #0e1a31 8px, #0b162a 8px, #0b162a 16px);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: var(--muted);
    }

    .rank {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .suit {
      font-size: 18px;
    }

    .corner {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 16px;
      opacity: 0.7;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: linear-gradient(120deg, var(--accent), var(--accent-strong));
      color: #0d0d15;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
      box-shadow: 0 14px 28px var(--glow);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      box-shadow: none;
    }

    button.ghost {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      box-shadow: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px var(--glow);
    }

    .message {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      min-height: 20px;
      color: var(--muted);
    }

    .message.strong {
      background: rgba(246, 195, 68, 0.1);
      border-color: rgba(246, 195, 68, 0.3);
      color: #ffddb4;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .card {
        width: 64px;
        height: 92px;
      }
      .rank {
        font-size: 22px;
      }
      .suit,
      .corner {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="title">Blackjack</div>
      <div class="chip" id="statusChip">Setting the table...</div>
      <div class="chip" id="scoreBoard">Score: 0 - 0 (Pushes: 0)</div>
    </header>
    <div class="table">
      <div class="table-head">
        <div class="status-pill" id="turnLabel">Dealing...</div>
        <div class="chip" id="roundHint">Try to beat 21 without busting.</div>
        <div style="flex:1"></div>
        <button class="secondary" id="newBtn">New Game</button>
      </div>
      <div class="table-body">
        <section class="hand" aria-live="polite">
          <div class="hand-header">
            <div class="hand-title">Dealer</div>
            <div class="value" id="dealerValue">Value: ??</div>
          </div>
          <div class="cards" id="dealerCards"></div>
        </section>
        <section class="hand" aria-live="polite">
          <div class="hand-header">
            <div class="hand-title">You</div>
            <div class="value" id="playerValue">Value: 0</div>
          </div>
          <div class="cards" id="playerCards"></div>
        </section>
        <div class="actions">
          <button id="hitBtn">Hit</button>
          <button class="ghost" id="standBtn">Stand</button>
        </div>
        <div class="message" id="message"></div>
      </div>
    </div>
  </div>
  <script>
    const ui = {
      dealerCards: document.getElementById("dealerCards"),
      playerCards: document.getElementById("playerCards"),
      dealerValue: document.getElementById("dealerValue"),
      playerValue: document.getElementById("playerValue"),
      message: document.getElementById("message"),
      hitBtn: document.getElementById("hitBtn"),
      standBtn: document.getElementById("standBtn"),
      newBtn: document.getElementById("newBtn"),
      statusChip: document.getElementById("statusChip"),
      scoreBoard: document.getElementById("scoreBoard"),
      turnLabel: document.getElementById("turnLabel"),
      roundHint: document.getElementById("roundHint"),
    };

    let gameId = null;
    let busy = false;
    let scoreRecorded = false;
    const score = { player: 0, dealer: 0, ties: 0 };

    function setBusy(state) {
      busy = state;
      ui.hitBtn.disabled = state || !gameId;
      ui.standBtn.disabled = state || !gameId;
      ui.newBtn.disabled = state;
    }

    function cardElement(cardText) {
      const el = document.createElement("div");
      el.className = "card";

      if (cardText === "??") {
        el.classList.add("hidden");
        el.textContent = "??";
        el.setAttribute("aria-label", "Hidden card");
        return el;
      }

      const suit = cardText.slice(-1);
      const rank = cardText.slice(0, cardText.length - 1);
      const red = suit === "♥" || suit === "♦";
      if (red) el.classList.add("red");

      const rankEl = document.createElement("div");
      rankEl.className = "rank";
      rankEl.textContent = rank;

      const suitEl = document.createElement("div");
      suitEl.className = "suit";
      suitEl.textContent = suit;

      const corner = document.createElement("div");
      corner.className = "corner";
      corner.textContent = suit;

      el.append(rankEl, suitEl, corner);
      el.setAttribute("aria-label", `${rank} of ${suit}`);
      return el;
    }

    function renderCards(container, cards) {
      container.innerHTML = "";
      cards.forEach((card) => container.appendChild(cardElement(card)));
    }

    function renderScore() {
      ui.scoreBoard.textContent = `Score: ${score.player} - ${score.dealer} (Pushes: ${score.ties})`;
    }

    function setStatus(text, highlight = false) {
      ui.statusChip.textContent = text;
      ui.message.classList.toggle("strong", highlight);
    }

    function applyResultToScore(resultText) {
      if (!resultText) return;
      const normalized = resultText.toLowerCase();
      if (normalized.includes("tie")) {
        score.ties += 1;
      } else if (normalized.includes("dealer wins")) {
        score.dealer += 1;
      } else if (normalized.includes("you win")) {
        score.player += 1;
      }
      renderScore();
    }

    function renderState(state) {
      renderCards(ui.dealerCards, state.dealer.cards);
      renderCards(ui.playerCards, state.player.cards);

      ui.dealerValue.textContent = `Value: ${state.dealer.value ?? "??"}`;
      ui.playerValue.textContent = `Value: ${state.player.value}`;

      const finished = state.status === "finished";
      ui.hitBtn.disabled = busy || !state.canHit || finished;
      ui.standBtn.disabled = busy || !state.canStand || finished;

      if (finished) {
        if (!scoreRecorded) {
          applyResultToScore(state.result);
          scoreRecorded = true;
        }
        setStatus(state.result || "Round finished", true);
        ui.turnLabel.textContent = "Round finished";
        ui.message.textContent = state.result || "Thanks for playing!";
        ui.roundHint.textContent = "Deal a new round to keep playing.";
      } else {
        setStatus("Your move: Hit or Stand");
        ui.turnLabel.textContent = "Player turn";
        ui.message.textContent = state.player.isBust ? "You busted." : "Aim for 21 without going over.";
        ui.roundHint.textContent = "Dealer draws to 17 and must stand afterwards.";
      }
    }

    async function request(endpoint, payload = {}) {
      setBusy(true);
      try {
        const response = await fetch(`/api/${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: Object.keys(payload).length ? JSON.stringify(payload) : null,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }
        return data;
      } finally {
        setBusy(false);
      }
    }

    async function newGame() {
      try {
        setStatus("Shuffling and dealing...");
        ui.message.textContent = "";
        scoreRecorded = false;
        const data = await request("new");
        gameId = data.gameId;
        renderState(data.state);
      } catch (err) {
        const message = err?.message || "Unable to start the game.";
        setStatus(message, true);
        ui.message.textContent = message;
      }
    }

    async function hit() {
      if (!gameId || busy) return;
      try {
        const data = await request("hit", { gameId });
        renderState(data.state);
      } catch (err) {
        setStatus(err.message, true);
        ui.message.textContent = err.message;
      }
    }

    async function stand() {
      if (!gameId || busy) return;
      try {
        const data = await request("stand", { gameId });
        renderState(data.state);
      } catch (err) {
        setStatus(err.message, true);
        ui.message.textContent = err.message;
      }
    }

    ui.hitBtn.addEventListener("click", hit);
    ui.standBtn.addEventListener("click", stand);
    ui.newBtn.addEventListener("click", newGame);

    renderScore();
    newGame();
  </script>
</body>
</html>
